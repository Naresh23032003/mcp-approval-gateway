# Public HTTPS URL that OAuth 2.1 and MCP clients use to reach the gateway.
# Must use https with no path, query or fragment (http is allowed only for localhost, 127.0.0.1 or [::1] in tests).
public_base_url = "https://gw.example.ts.net"

# HTTP or HTTPS URL of the single upstream MCP server.
upstream_url = "http://demo:9000/mcp"

# Argon2id hash of the owner passphrase. Run `node dist/cli.js hash-passphrase` and paste the result here.
owner_passphrase_hash = ""

# Optional listener ports. Both listeners bind to 127.0.0.1.
[listen]
public_port = 8080
approve_port = 8081

# Optional write approval queue limits and retention settings.
[queue]
ttl_minutes = 15
max_pending = 50
purge_days = 7

# Optional notification settings.
[notify]
ntfy_url = "https://ntfy.example.net/topic"

# Allowed tools exposed by the gateway. At least one entry is required.
[[tools]]
name = "notes.search"
class = "read"
group = "read"

[[tools]]
name = "notes.append_note"
class = "write"
